name: CI

on:
  push:
    branches:
      - main
      - 'release/v*'
  pull_request:
    branches:
      - main
      - 'release/v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Poetry
        run: pipx install poetry
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
          cache: poetry
      - name: Install Nox
        run: |
          poetry env use python
          poetry install --only dev --no-root
      - name: Lint
        run: poetry run nox -s lint
      - name: Build
        run: poetry run nox -s build

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - name: Cache test data
        # Right after checkout the fixtures are still LFS pointer files, so hashing
        # them keys the cache on the object ids and invalidates it exactly when a
        # fixture changes.
        uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: lfs-${{ hashFiles('tests/data/*.qvd') }}
          restore-keys: lfs-
      - name: Fetch test data
        # The QVD fixtures are stored in Git LFS, which checkout does not fetch by
        # default. Only the fixtures used by the unit tests are pulled;
        run: git lfs pull --exclude="tests/data/giant.qvd,tests/data/huge.qvd"
      - name: Install Poetry
        run: pipx install poetry
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry
      - name: Install Nox
        run: |
          poetry env use python
          poetry install --only dev --no-root
      - name: Test
        run: poetry run nox -s tests
