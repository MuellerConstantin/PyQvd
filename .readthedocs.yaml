# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
    os: ubuntu-22.04
    tools:
        python: "3.12"

sphinx:
    configuration: docs/source/conf.py

python:
    install:
        - requirements: docs/requirements.txt
        # The project is installed from the checkout, so the documented code and version always
        # match the built commit, also before a release is published on PyPI
        - method: pip
          path: .
